version: '3.8'

services:
  # Main Backend Service
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    container_name: onewipe-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BLOCKCHAIN_SERVICE_URL=http://blockchain:4000
      - DEFAULT_COUNTRY=USA
      - DEFAULT_CITY=San Francisco
    volumes:
      - ./wipe-logs:/app/wipe-logs
      - ./logs:/app/logs
    depends_on:
      - blockchain
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Blockchain Certificate Service
  blockchain:
    build:
      context: ./blockchain-certs
      dockerfile: Dockerfile
    container_name: onewipe-blockchain
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - AMOY_RPC_URL=${AMOY_RPC_URL}
      - PRIVATE_KEY=${PRIVATE_KEY}
    volumes:
      - ./blockchain-certs/deployed:/app/deployed
      - ./blockchain-certs/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: onewipe-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # Grafana for Dashboards (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: onewipe-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=onewipe123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/datasources:/etc/grafana/provisioning/datasources
    restart: unless-stopped

  # Log aggregation with Loki (optional)
  loki:
    image: grafana/loki:latest
    container_name: onewipe-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  # Log shipping with Promtail (optional)
  promtail:
    image: grafana/promtail:latest
    container_name: onewipe-promtail
    volumes:
      - ./logs:/var/log/onewipe
      - ./blockchain-certs/logs:/var/log/blockchain
      - ./monitoring/promtail.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: onewipe-network